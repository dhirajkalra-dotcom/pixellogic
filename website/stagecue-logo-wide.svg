<?xml version="1.0" encoding="UTF-8"?>
<!--
  StageCue wordmark (horizontal) — for Help header, About dialog, docs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240">
  <defs>
    <linearGradient id="beamW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Icon glyph -->
  <g transform="translate(20,20)">
    <circle cx="100" cy="100" r="92" fill="#0b0d12" stroke="#e2e8f0" stroke-width="8"/>
    <rect x="86" y="-6" width="28" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="93" y="-18" width="14" height="14" rx="3" fill="#e2e8f0"/>
    <path d="M 66 58 L 66 142 L 152 100 Z" fill="url(#beamW)"/>
    <circle cx="100" cy="100" r="6" fill="#0b0d12" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="250" y="130" font-size="110" fill="#e7ecf3" letter-spacing="-2">Stage</text>
    <text x="555" y="130" font-size="110" fill="#f59e0b" letter-spacing="-2">Cue</text>
    <text x="252" y="180" font-size="28"  fill="#94a3b8" letter-spacing="6">COUNTDOWN · CUES · CONTROL</text>
  </g>
</svg>
