<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Expired — PixelLogic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
       background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#1e293b;padding:40px;border-radius:14px;max-width:480px;text-align:center;
        box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .icon{font-size:54px;margin-bottom:10px}
  h1{margin:0 0 12px;color:#f87171}
  p{line-height:1.6;color:#cbd5e1}
  a.btn{display:inline-block;margin-top:18px;padding:12px 28px;background:#6366f1;color:#fff;
        border-radius:8px;text-decoration:none;font-weight:600}
  a.btn:hover{background:#4f46e5}
  .small{font-size:13px;color:#94a3b8;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏰</div>
    <h1>This link has expired</h1>
    <p>For security, full-version download links are valid for a limited time and tied to the email of the person who requested them.</p>
    <p>Please request a fresh link and we'll send you a new one shortly.</p>
    <a class="btn" href="/index.html#request-access">Request New Link</a>
    <div class="small">Need help? Email <a href="mailto:support@yoursite.com" style="color:#a5b4fc">support@yoursite.com</a></div>
  </div>
</body>
</html>
