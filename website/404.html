<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .error-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
    }
    .error-code {
      font-size: clamp(80px, 15vw, 160px); font-weight: 900;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1;
    }
    .error-title {
      font-size: clamp(20px, 3vw, 32px); font-weight: 700;
      color: var(--text-1); margin: 16px 0 10px;
    }
    .error-desc {
      font-size: 16px; color: var(--text-3); max-width: 420px;
      margin: 0 auto 32px; line-height: 1.6;
    }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <section class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Go to Homepage</a>
        <a href="pixelogic.html" class="btn btn-outline">Pixelogic</a>
        <a href="eventflow.html" class="btn btn-outline">Eventflow</a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
