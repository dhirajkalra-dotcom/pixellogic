<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PixelLogic" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="PixelLogic Mobile — LED wall & projector design tools." />

  <title>PixelLogic Mobile</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="app-header">
    <button id="btn-menu" class="icon-btn" aria-label="Menu">☰</button>
    <h1 id="app-title">PixelLogic</h1>
    <button id="btn-home" class="icon-btn" aria-label="Home">⌂</button>
  </header>

  <main id="view" class="view" role="main">
    <!-- Feature views are rendered here -->
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-btn" data-route="projects">
      <span class="nav-icon">▤</span><span class="nav-label">Projects</span>
    </button>
    <button class="nav-btn" data-route="designer">
      <span class="nav-icon">▦</span><span class="nav-label">Designer</span>
    </button>
    <button class="nav-btn" data-route="visualizer">
      <span class="nav-icon">◧</span><span class="nav-label">Visualize</span>
    </button>
    <button class="nav-btn" data-route="power-calc">
      <span class="nav-icon">⚡</span><span class="nav-label">Power</span>
    </button>
    <button class="nav-btn" data-route="more">
      <span class="nav-icon">•••</span><span class="nav-label">More</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
