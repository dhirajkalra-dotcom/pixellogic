<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PixelLogic Link Generator</title>
<style>
  body{font-family:system-ui,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
  .wrap{max-width:600px;margin:0 auto}
  h1{margin:0 0 6px}
  .sub{color:#94a3b8;margin:0 0 20px;font-size:14px}
  .setup{background:#1e293b;padding:16px;border-radius:10px;margin-bottom:18px}
  .setup label{display:block;margin:8px 0 4px;font-size:13px;color:#cbd5e1}
  .setup input{width:100%;padding:8px;border-radius:5px;border:1px solid #334155;
               background:#0f172a;color:#fff;box-sizing:border-box;font-size:13px}
  button.gen{width:100%;padding:14px;border:0;border-radius:8px;background:#6366f1;
             color:#fff;font-weight:700;cursor:pointer;font-size:15px;margin-bottom:18px}
  button.gen:hover{background:#4f46e5}
  .product{background:#1e293b;padding:16px;border-radius:10px;margin-bottom:12px;
           border-left:4px solid var(--c)}
  .product h3{margin:0 0 8px;color:var(--c)}
  .link{background:#020617;padding:10px;border-radius:5px;font-family:Consolas,monospace;
        font-size:11px;color:#a5b4fc;word-break:break-all;margin:8px 0;min-height:18px}
  .copy{padding:8px 16px;border:0;border-radius:5px;background:#10b981;color:#fff;
        font-weight:600;cursor:pointer;font-size:13px}
  .copy:hover{background:#059669}
  .exp{font-size:12px;color:#94a3b8;margin-left:10px}
  summary{outline:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 Download Link Generator</h1>
  <p class="sub">Click <b>Generate</b>, then copy the link for the product you want to send.</p>

  <details class="setup">
    <summary style="cursor:pointer;color:#a5b4fc;font-size:13px">⚙️ Settings (set once)</summary>
    <label>Secret (must match get.php on server)</label>
    <input id="secret" value="CHANGE-ME-TO-A-LONG-RANDOM-STRING-1a2b3c4d5e6f7g8h9i0j">
    <label>Website URL</label>
    <input id="site" value="https://yoursite.com">
    <label>Validity (hours)</label>
    <input id="hours" type="number" min="1" max="168" value="24">
  </details>

  <button class="gen" onclick="genAll()">⚡ Generate All Links</button>

  <div class="product" style="--c:#6366f1">
    <h3>🎨 PixelLogic</h3>
    <div class="link" id="lnk-pixelogic">Click Generate above…</div>
    <button class="copy" onclick="copy('pixelogic',this)">📋 Copy Link</button>
    <span class="exp" id="exp-pixelogic"></span>
  </div>

  <div class="product" style="--c:#14b8a6">
    <h3>🎬 EventFlow Schematics</h3>
    <div class="link" id="lnk-eventflow">Click Generate above…</div>
    <button class="copy" onclick="copy('eventflow',this)">📋 Copy Link</button>
    <span class="exp" id="exp-eventflow"></span>
  </div>

  <div class="product" style="--c:#f97316">
    <h3>🎭 StageCue</h3>
    <div class="link" id="lnk-stagecue">Click Generate above…</div>
    <button class="copy" onclick="copy('stagecue',this)">📋 Copy Link</button>
    <span class="exp" id="exp-stagecue"></span>
  </div>
</div>

<script>
async function hmac(key, msg) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(key),
    {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function genAll() {
  const secret = document.getElementById('secret').value.trim();
  const site   = document.getElementById('site').value.trim().replace(/\/$/, '');
  const hours  = parseInt(document.getElementById('hours').value) || 24;
  const exp    = Math.floor(Date.now()/1000) + hours*3600;
  const expStr = new Date(exp*1000).toLocaleString();

  for (const p of ['pixelogic','eventflow','stagecue']) {
    const sig = await hmac(secret, p + '|' + exp);
    const url = `${site}/get.php?p=${p}&e=${exp}&s=${sig}`;
    document.getElementById('lnk-'+p).textContent = url;
    document.getElementById('exp-'+p).textContent = '⏰ Expires ' + expStr;
  }
}

function copy(p, btn) {
  const txt = document.getElementById('lnk-'+p).textContent;
  if (!txt || txt.startsWith('Click')) return;
  navigator.clipboard.writeText(txt);
  const orig = btn.textContent;
  btn.textContent = '✅ Copied!';
  setTimeout(()=>btn.textContent=orig, 1500);
}
</script>
</body>
</html>
